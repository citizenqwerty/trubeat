name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check src tests   # blocking: tree stays lint-clean
      - run: pip install -e .   # core pipeline deps (headless cv2, mediapipe, …)
      - run: PYTHONPATH=src pytest tests/ -q
